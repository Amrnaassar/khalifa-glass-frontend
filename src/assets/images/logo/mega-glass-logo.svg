<line x1="130" y1="50" x2="130" y2="210" stroke="#ffffff" stroke-width="2.5" opacity="0.85"/>
<line x1="50" y1="130" x2="210" y2="130" stroke="#ffffff" stroke-width="2.5" opacity="0.85"/>
<polygon points="130,50 210,130 130,210 50,130" fill="none" stroke="#0F5132" stroke-width="2"/>
