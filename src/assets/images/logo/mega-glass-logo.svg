<svg width="680" height="250" viewBox="0 0 680 250" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Mega Glass logo</title>
<desc>A faceted diamond glass-pane icon in deep green, beside the wordmark Mega Glass.</desc>
<g>
<polygon points="130,130 130,50 50,130" fill="#2f9d68"/>
<polygon points="130,130 50,130 130,210" fill="#14532D"/>
<polygon points="130,130 130,210 210,130" fill="#0F5132"/>
